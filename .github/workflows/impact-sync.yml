name: Sync Impact Numbers

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate impact numbers
        env:
          # GITHUB_TOKEN lifts API rate limits and enables the contributors count.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_impact.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: sync impact numbers"
          title: "Sync impact numbers (citations, GitHub stats)"
          body: |
            Automated refresh of `_data/impact.yml` from OpenAlex + GitHub.
            Generated by `scripts/build_impact.py`.
          branch: auto/impact-sync
          base: gh-pages
          add-paths: _data/impact.yml
