name: Sync Publications Data

on:
  push:
    paths:
      - publications.bib
      - bin/bibtex_to_yaml.rb
      - bin/update_publications.sh
      - Gemfile
      - Gemfile.lock
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Generate publication YAML from BibTeX
        run: bundle exec ruby bin/bibtex_to_yaml.rb -f

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: sync publications data from publications.bib"
          title: "Sync publications data from publications.bib"
          branch: auto/pub-sync
          base: gh-pages
          add-paths: _data/publist.yml